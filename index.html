    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Happy Teachers Day</h1>

        document.getElementById("message"). innerHtML = "Dear Ma'am, Thank you for your patience, kindness, and for always helping us learn. your lesson and encouragement mean a lot to me."
    }
      
    </script>
    <main>

        <section class="media-section">
            <h2>Favourite Photo</h2>

            <div class="photos">
                <img src="download.jfif" alt="Favourite Photo 1">
            </div>
        </section>

        <section class="media-section">
            <h2>Favourite Audio</h2>

            <div class="audios">
                <audio controls>
                    <source src="You Are The Reason (Teacher's Day Song) - Sylvia Wong (Lyrics)" type="video/mp4">
                </audio>

            </div>
        </section>

    </main>

</body>
</html>
